<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أحبك ❤️</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { height:100%; }
  body {
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; background:radial-gradient(circle at 50% 40%, #3d1a5e, #150820 70%, #0a0410);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    cursor:pointer; overflow:hidden; position:relative;
  }

  .glow {
    position:absolute; border-radius:50%; filter:blur(80px); z-index:0;
    animation:float 8s ease-in-out infinite;
  }
  .glow1 { width:420px; height:420px; background:rgba(255,60,120,.35); top:-80px; left:-80px; }
  .glow2 { width:360px; height:360px; background:rgba(168,85,247,.3); bottom:-60px; right:-60px; animation-delay:3s; }
  .glow3 { width:260px; height:260px; background:rgba(0,212,255,.25); top:50%; left:55%; animation-delay:-4s; }

  @keyframes float {
    0%,100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(30px,-30px) scale(1.15); }
  }

  .container { text-align:center; position:relative; z-index:2; padding:20px; }

  .text {
    font-size:clamp(3rem, 12vw, 7rem);
    font-weight:800; color:#ffd1e0; line-height:1.15;
    letter-spacing:1px;
    text-shadow:0 0 25px rgba(255,60,120,.6), 0 4px 12px rgba(0,0,0,.5);
    transition:opacity .3s ease, transform .3s ease;
    font-family:'Segoe UI', 'Noto Naskh Arabic', Tahoma, sans-serif;
  }

  .sparkles { position:absolute; inset:0; pointer-events:none; z-index:1; }
  .spark {
    position:absolute; color:#ffd6e6; font-size:20px; opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise {
    0% { transform:translateY(20vh) scale(.5) rotate(0); opacity:0; }
    15% { opacity:.9; }
    100% { transform:translateY(-70vh) scale(1.4) rotate(280deg); opacity:0; }
  }
</style>
</head>
<body onclick="nextPhrase()">
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>
  <div class="glow glow3"></div>

  <div class="sparkles" id="sparkles"></div>

  <div class="container">
    <div class="text" id="text">أنا أحبك</div>
  </div>

<script>
  const phrases = ["أنا أحبك", "I love you", "Ich liebe dich"];
  let index = 0;
  const textEl = document.getElementById('text');
  const sparkles = document.getElementById('sparkles');

  function spawnSparkle() {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = ['✦','♥','✦','❥','✦'][Math.floor(Math.random()*5)];
    s.style.left = Math.random()*100 + '%';
    s.style.fontSize = (14 + Math.random()*22) + 'px';
    s.style.animationDuration = (6 + Math.random()*6) + 's';
    s.style.animationDelay = (Math.random()*6) + 's';
    sparkles.appendChild(s);
  }
  for (let i = 0; i < 18; i++) spawnSparkle();

  function spawnBurst() {
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = '♥';
      s.style.left = '50%'; s.style.top = '50%';
      const ang = (i/14)*Math.PI*2;
      const dist = 120;
      s.style.setProperty('--tx', Math.cos(ang)*dist + 'px');
      s.style.setProperty('--ty', Math.sin(ang)*dist + 'px');
      s.style.animation = 'none';
      s.style.transition = 'all .7s ease-out';
      s.style.opacity = 1; s.style.fontSize = '18px';
      document.body.appendChild(s);
      requestAnimationFrame(()=> {
        s.style.transform = 'translate(var(--tx), var(--ty)) scale(1)';
        s.style.opacity = 0;
      });
      setTimeout(()=> s.remove(), 750);
    }
  }

  function nextPhrase() {
    index = (index + 1) % phrases.length;
    textEl.style.opacity = 0;
    textEl.style.transform = 'scale(.85)';
    setTimeout(() => {
      textEl.textContent = phrases[index];
      textEl.style.opacity = 1;
      textEl.style.transform = 'scale(1)';
    }, 200);
    spawnBurst();
  }
</script>
</body>
</html>
